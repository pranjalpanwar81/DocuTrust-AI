# DocuTrust AI on Netlify.
#  - Frontend: app/static, copied into web/public at build time.
#  - Backend: web/netlify/functions/api.mts (TypeScript port of the FastAPI app),
#    serving /api/* and /health.
#  - Database: Netlify Database (Postgres); migrations in
#    web/netlify/database/migrations are applied automatically on deploy.
# The base directory is web/ so Netlify ignores the root Python files
# (requirements.txt, runtime.txt), which are only for running the original
# FastAPI backend locally.

[build]
  base = "web"
  command = "npm run build"
  publish = "public"

[functions]
  # OCR runs tesseract.js in a worker thread and loads its WASM core and the
  # bundled English model from disk, so these must ship as real node_modules.
  external_node_modules = ["tesseract.js", "tesseract.js-core", "@tesseract.js-data/eng"]
