# Netlify hosts the static DocuTrust AI frontend (app/static).
# The FastAPI backend stays on Render; Netlify proxies API calls to it,
# so the browser sees a single origin and no CORS changes are needed.

[build]
  # Build from app/static so Netlify ignores the root Python files
  # (requirements.txt / runtime.txt are for the Render backend only).
  base = "app/static"
  publish = "."
  command = ""

# index.html references assets as /static/..., but they live at the
# publish root on Netlify.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Proxy the backend API to Render.
[[redirects]]
  from = "/api/*"
  to = "https://docutrust-ai-r2fl.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://docutrust-ai-r2fl.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "https://docutrust-ai-r2fl.onrender.com/docs"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "https://docutrust-ai-r2fl.onrender.com/openapi.json"
  status = 200
  force = true
